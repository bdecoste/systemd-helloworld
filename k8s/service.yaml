apiVersion: v1
kind: Service
metadata:
  name: helloworld
  labels:
    app: helloworld
spec:
  # ClusterIP for in-cluster access. For external EKS exposure, add an
  # Ingress (AWS Load Balancer Controller -> ALB) or switch to type: LoadBalancer
  # for a classic NLB. See README for the AWS-specific wiring.
  type: ClusterIP
  selector:
    app: helloworld
  ports:
    - name: http
      port: 80
      targetPort: http
