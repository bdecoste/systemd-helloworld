# External exposure via the Traefik Ingress Controller.
# Requires the controller installed in the cluster and its "traefik" IngressClass:
#   helm upgrade --install traefik traefik \
#     --repo https://traefik.github.io/charts \
#     --namespace traefik --create-namespace
# On EKS the controller's Service is typically type: LoadBalancer, which
# provisions an NLB — that NLB is the public entry point for this Ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helloworld
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: helloworld
                port:
                  number: 80
