# External exposure via the NGINX Ingress Controller (ingress-nginx).
# Requires the controller installed in the cluster and its "nginx" IngressClass:
#   helm upgrade --install ingress-nginx ingress-nginx \
#     --repo https://kubernetes.github.io/ingress-nginx \
#     --namespace ingress-nginx --create-namespace
# On EKS the controller's Service is typically type: LoadBalancer, which
# provisions an NLB — that NLB is the public entry point for this Ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helloworld
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: helloworld
                port:
                  number: 80
