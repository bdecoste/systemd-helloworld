apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helloworld.fullname" . }}-config
  labels:
    {{- include "helloworld.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.config.port | quote }}
  GREETING: {{ .Values.config.greeting | quote }}
  ENVIRONMENT: {{ .Values.config.environment | quote }}
